<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM-DailyDigest · 日报阅读反馈</title>
<style>
  :root{
    --primary:#6366f1; --accent:#a855f7; --bg:#0f1117; --card:#1a1b26;
    --fg:#e6e6ec; --muted:#9aa0b5; --border:#2a2c3a; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    background:linear-gradient(160deg,#0f1117,#16182a 60%);color:var(--fg);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:1.5rem;margin:0 0 4px}
  h1 span{background:linear-gradient(135deg,var(--primary),var(--accent));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .card h2{font-size:1.02rem;margin:0 0 10px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
  input[type=date],input[type=text],select,textarea{background:#12131c;color:var(--fg);border:1px solid var(--border);
    border-radius:8px;padding:9px 11px;font-size:.92rem;font-family:inherit}
  textarea{width:100%;min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
  select{max-width:100%}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .kinds{display:flex;gap:14px;flex-wrap:wrap}
  .kinds label{display:inline-flex;align-items:center;gap:.3rem;margin:0;color:var(--fg);font-size:.9rem;cursor:pointer}
  button{cursor:pointer;border:none;border-radius:9px;padding:10px 16px;font-size:.9rem;font-weight:600;
    background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;transition:transform .15s,opacity .15s}
  button:hover{transform:translateY(-1px)} button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--fg)}
  button.sm{padding:5px 10px;font-size:.8rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .hint{font-size:.78rem;color:var(--muted)}
  .errlist{color:var(--err);font-size:.85rem;margin:8px 0}
  .oklist{color:var(--ok);font-size:.85rem;margin:8px 0}
  a{color:var(--primary)}
  .pill{font-size:.72rem;border-radius:5px;padding:1px 7px;margin-right:6px;display:inline-block}
  .k-insight{background:rgba(34,197,94,.16);color:var(--ok)}
  .k-complaint{background:rgba(239,68,68,.16);color:var(--err)}
  .k-idea{background:rgba(245,158,11,.16);color:var(--warn)}
  .fb{border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-top:10px;background:#12131c}
  .fb.closed{opacity:.6}
  .fb .meta{font-size:.78rem;color:var(--muted);margin-bottom:6px}
  .fb .text{white-space:pre-wrap;font-size:.92rem;line-height:1.55}
  .fb .res{font-size:.82rem;color:var(--ok);margin-top:6px;white-space:pre-wrap}
  .fb .ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .fb .ops input{flex:1;min-width:200px;padding:5px 9px;font-size:.82rem}
  .tabs{display:flex;gap:6px;margin-bottom:4px}
  .tabs button.on{outline:2px solid var(--primary)}
  .due{border-color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>📮 日报阅读反馈</span></h1>
  <p class="sub">读完日报后记下：得到了什么新认识、哪里不满意、想要什么改进。未处理的「不满意 / 建议」每 {{ remind_days }} 天在启动 app.py 时与首页提醒一次。 · <a href="/">← 返回录入</a></p>

  <div class="card due" id="dueCard" style="display:none">
    <div id="dueText"></div>
    <div class="actions"><button class="ghost sm" id="btnAck">✓ 本周已查看（{{ remind_days }} 天内不再提醒）</button></div>
  </div>

  <div class="card">
    <h2>写一条反馈</h2>
    <div class="row">
      <div>
        <label>针对哪期日报</label>
        <input type="date" id="digestDate" value="{{ default_date }}">
      </div>
      <div style="flex:1;min-width:240px">
        <label>关联条目（可选）</label>
        <select id="itemSel" style="width:100%"><option value="">— 整期 / 不针对具体条目 —</option></select>
      </div>
    </div>
    <label>类型</label>
    <div class="kinds">
      {% for k, v in kinds.items() %}
      <label><input type="radio" name="kind" value="{{ k }}" {% if k == 'complaint' %}checked{% endif %}> {{ v }}</label>
      {% endfor %}
    </div>
    <label>内容（⌘/Ctrl + Enter 提交）</label>
    <textarea id="text" placeholder="例：xx 条的「启示」只是复述摘要，没有点出与已有方法的本质区别…"></textarea>
    <div class="actions"><button id="btnAdd">➕ 记录</button><span id="addMsg"></span></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="ghost sm on" data-f="open">待修</button>
      <button class="ghost sm" data-f="insight">新认识</button>
      <button class="ghost sm" data-f="all">全部</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const KINDS = {{ kinds | tojson }};
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ITEMS = [], FILTER = 'open';

async function loadDayItems(){
  const sel = $('itemSel');
  sel.innerHTML = '<option value="">— 整期 / 不针对具体条目 —</option>';
  const d = $('digestDate').value;
  if(!d) return;
  try{
    const j = await (await fetch('/api/feedback/day_items?date='+encodeURIComponent(d))).json();
    (j.items||[]).forEach(it=>{
      const o = document.createElement('option');
      o.value = it.id; o.textContent = it.title || it.id; o.dataset.title = it.title || '';
      sel.appendChild(o);
    });
    if(!(j.items||[]).length) sel.options[0].textContent = '— 该日无日报条目 —';
  }catch(e){ /* 条目列表只是辅助，失败不影响记录 */ }
}

async function loadList(){
  const j = await (await fetch('/api/feedback')).json();
  ITEMS = j.items || [];
  const open = ITEMS.filter(x=>x.status==='open');
  $('dueCard').style.display = j.due ? '' : 'none';
  $('dueText').innerHTML = `📮 本周提醒：有 <b>${j.due}</b> 条「不满意 / 建议」待修。修完后在下方标记「已修复」。`;
  document.querySelector('.tabs [data-f=open]').textContent = `待修 (${open.length})`;
  render();
}

function render(){
  let rows = ITEMS.slice().reverse();
  if(FILTER==='open') rows = rows.filter(x=>x.status==='open');
  else if(FILTER==='insight') rows = rows.filter(x=>x.kind==='insight');
  if(!rows.length){ $('list').innerHTML = '<div class="hint" style="margin-top:8px">暂无</div>'; return; }
  $('list').innerHTML = rows.map(x=>{
    const closed = x.status==='fixed' || x.status==='wontfix';
    const where = [x.digest_date, x.item_title || x.item_id].filter(Boolean).map(esc).join(' · ');
    const st = {open:'待修', fixed:'已修复', wontfix:'不修', noted:'已记录'}[x.status] || x.status;
    let ops = '';
    if(x.status==='open'){
      ops = `<div class="ops"><input type="text" class="res" placeholder="怎么修的（可选）">
        <button class="sm" data-st="fixed">✓ 已修复</button>
        <button class="ghost sm" data-st="wontfix">不修</button></div>`;
    }else if(closed){
      ops = `<div class="ops"><button class="ghost sm" data-st="open">↺ 重新打开</button></div>`;
    }
    return `<div class="fb ${closed?'closed':''}" data-id="${esc(x.id)}">
      <div class="meta"><span class="pill k-${esc(x.kind)}">${esc(KINDS[x.kind]||x.kind)}</span>${where || '—'} · ${esc(x.created_at)} · ${esc(st)}</div>
      <div class="text">${esc(x.text)}</div>
      ${x.resolution ? `<div class="res">↳ ${esc(x.resolution)}</div>` : ''}
      ${ops}</div>`;
  }).join('');
}

// 事件委托：id 只经 data-id 传递，不拼进内联脚本
$('list').addEventListener('click', e=>{
  const b = e.target.closest('button[data-st]'); if(!b) return;
  const card = b.closest('.fb');
  setStatus(card.dataset.id, b.dataset.st, card.querySelector('input.res'));
});

async function setStatus(id, status, inp){
  const body = {status};
  if(inp && inp.value.trim()) body.resolution = inp.value.trim();
  const r = await fetch('/api/feedback/'+encodeURIComponent(id), {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok){ alert('更新失败'); return; }
  loadList();
}

$('btnAdd').onclick = async ()=>{
  const sel = $('itemSel'), opt = sel.options[sel.selectedIndex];
  const body = {
    kind: document.querySelector('input[name=kind]:checked').value,
    text: $('text').value,
    digest_date: $('digestDate').value,
    item_id: sel.value,
    item_title: sel.value ? (opt.dataset.title || '') : '',
  };
  const j = await (await fetch('/api/feedback', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
  if(!j.ok){ $('addMsg').innerHTML = '<span class="errlist">'+esc((j.errors||[]).join('；'))+'</span>'; return; }
  $('addMsg').innerHTML = '<span class="oklist">✓ 已记录</span>';
  $('text').value = '';  // 日期 / 类型 / 关联条目保留，便于连续录入
  loadList();
};
$('text').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) $('btnAdd').onclick(); });
$('digestDate').onchange = loadDayItems;
$('btnAck').onclick = async ()=>{ await fetch('/api/feedback/ack',{method:'POST'}); loadList(); };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); FILTER = b.dataset.f; render();
});

loadDayItems();
loadList();
</script>
</body>
</html>
