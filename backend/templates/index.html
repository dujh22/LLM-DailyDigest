<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM-DailyDigest · 提交消息</title>
<style>
  :root{
    --primary:#6366f1; --accent:#a855f7; --bg:#0f1117; --card:#1a1b26;
    --fg:#e6e6ec; --muted:#9aa0b5; --border:#2a2c3a; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
    background:linear-gradient(160deg,#0f1117,#16182a 60%);color:var(--fg);min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:1.6rem;margin:0 0 4px}
  h1 span{background:linear-gradient(135deg,var(--primary),var(--accent));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--muted);margin:0 0 24px;font-size:.92rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:1.05rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 .num{color:var(--primary);font-size:.9rem}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
  input[type=text],textarea,select{width:100%;background:#12131c;color:var(--fg);
    border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:.92rem;font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .topics label{display:inline-flex;align-items:center;gap:5px;margin:0;
    background:#12131c;border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--fg)}
  .topics input{width:auto;accent-color:var(--primary)}
  .topics label:has(input:checked){border-color:var(--primary);background:rgba(99,102,241,.15)}
  button{cursor:pointer;border:none;border-radius:9px;padding:10px 18px;font-size:.92rem;font-weight:600;
    background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;transition:transform .15s,opacity .15s}
  button:hover{transform:translateY(-1px)} button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--fg)}
  .actions{display:flex;gap:10px;align-items:center;margin-top:18px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;display:none;font-size:.9rem;z-index:99}
  .toast.show{display:block}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
  .errlist{color:var(--err);font-size:.85rem;margin:8px 0}
  a{color:var(--primary)}
  .hint{font-size:.78rem;color:var(--muted);margin-top:4px}
  .addtopic{display:flex;gap:8px;margin-top:8px}
  .addtopic input{flex:1}
  .badge-new{font-size:.65rem;background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .topics label.is-new{border-color:var(--accent);background:rgba(168,85,247,.12)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>LLM-DailyDigest</span> · 消息提交</h1>
  <p class="sub">填写一条消息 → 自动追加到当日日报（<code>content/updates/&lt;date&gt;.md</code>）。原始信息可直接用 LLM 抽取。</p>

  <!-- ① LLM 抽取 -->
  <div class="card">
    <h2>① 用 LLM 抽取 <span class="num">（可选）</span></h2>
    <label>粘贴原始信息（公众号文章 / 论文摘要 / 一段文字）</label>
    <textarea id="raw" placeholder="把未经整理的信息粘进来，点按钮自动填充下方表单…"></textarea>
    <div class="actions">
      <button id="btnExtract">✨ LLM 抽取</button>
      <button class="ghost" id="btnClear">清空表单</button>
    </div>
    <div id="extractMsg"></div>
  </div>

  <!-- ② 表单 -->
  <div class="card">
    <h2>② 消息字段</h2>

    <div class="row3">
      <div>
        <label>id（可选，留空自动生成）</label>
        <input type="text" id="id">
      </div>
      <div>
        <label>目标日期（留空=今天，迁移历史用）</label>
        <input type="text" id="date" placeholder="YYYY-MM-DD">
      </div>
      <div>
        <label>标题 *</label>
        <input type="text" id="title">
      </div>
    </div>

    <div class="row">
      <div>
        <label>子主题（决定主题页栏目）</label>
        <input type="text" id="subtopic" placeholder="如：多跳问答">
      </div>
      <div>
        <label>来源</label>
        <input type="text" id="source" placeholder="如：arxiv cs.CL / 量子位">
      </div>
    </div>

    <label>所属主题 *（可多选，决定出现在哪些主题页）</label>
    <div class="topics" id="topics">
      {% for t in topics %}<label><input type="checkbox" value="{{ t }}"> {{ t }}</label>{% endfor %}
    </div>
    <div class="addtopic">
      <input type="text" id="newTopicInput" placeholder="手动新增主题名（提交时自动建页）">
      <button type="button" class="ghost" id="btnAddTopic">＋ 新增</button>
    </div>

    <label>归属研究项目（可多选 / 可不选，决定出现在哪个研究的「相关工作」）</label>
    <div class="topics" id="research">
      {% for r in research %}<label><input type="checkbox" value="{{ r }}"> {{ r }}</label>{% endfor %}
    </div>

    <label>一句话摘要</label>
    <input type="text" id="summary">

    <div class="row3">
      <div><label>📄 论文</label><input type="text" id="paper" placeholder="arxiv URL"></div>
      <div><label>💻 代码</label><input type="text" id="code" placeholder="github URL"></div>
      <div><label>📊 数据集</label><input type="text" id="dataset"></div>
    </div>
    <label>🔗 原文（非论文类）</label>
    <input type="text" id="link">

    <label>内容正文（支持 Markdown）</label>
    <textarea id="content"></textarea>
    <label>用途与启示（支持 Markdown 列表）</label>
    <textarea id="purpose"></textarea>
    <label>📝 原始笔记（逐字保留，支持纯文本换行）</label>
    <textarea id="notes" placeholder="粘贴原始信息全文，提交后将在日报页以折叠区块逐字保留"></textarea>

    <div class="actions">
      <button id="btnSubmit">➕ 提交（追加到当日日报）</button>
      <span class="hint">提交后刷新 <code>hugo server</code> 即可在日报页看到新条目。</span>
    </div>
    <div id="submitMsg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const F = ["id","title","subtopic","source","summary","paper","code","dataset","link","content","purpose","notes"];
const $ = id => document.getElementById(id);

function setVal(id,v){ if(v!==undefined && v!==null && v!=="") $(id).value = v; }
function getCheckedTopics(){
  return [...document.querySelectorAll('#topics input:checked')].map(c=>c.value);
}
function getCheckedResearch(){
  return [...document.querySelectorAll('#research input:checked')].map(c=>c.value);
}
function checkGroup(groupId, want){
  document.querySelectorAll('#'+groupId+' input').forEach(c=>{
    if(want.includes(c.value)) c.checked = true;
  });
}
function checkTopics(want){
  // 勾选与 want 匹配的主题
  document.querySelectorAll('#topics input').forEach(c=>{
    if(want.includes(c.value)) c.checked = true;
  });
}
// 新增一个主题 chip（isNew=true 时标记「新」并默认勾选）
function addTopicChip(name, isNew){
  name = (name||'').trim();
  if(!name) return;
  // 去重：已存在同 value 的 checkbox 就只勾选
  const existed = document.querySelector(`#topics input[value="${name}"]`);
  if(existed){ existed.checked = true; return; }
  const lbl = document.createElement('label');
  if(isNew) lbl.className = 'is-new';
  lbl.innerHTML = `<input type="checkbox" value="${name}" ${isNew?'checked':''}> ${name}${isNew?'<span class="badge-new">新</span>':''}`;
  $('topics').appendChild(lbl);
}
function clearForm(){
  F.forEach(id=>$(id).value="");
  // 清除所有「新」chip，原有主题/研究取消勾选
  document.querySelectorAll('#topics label.is-new').forEach(e=>e.remove());
  document.querySelectorAll('#topics input, #research input').forEach(c=>c.checked=false);
}
function toast(msg, kind){
  const t = $('toast'); t.className = 'toast show ' + (kind||'');
  t.textContent = msg; clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.className='toast', 4000);
}

$('btnClear').onclick = clearForm;

$('btnAddTopic').onclick = ()=>{
  const v = $('newTopicInput').value;
  if(!v.trim()){ toast('请输入主题名','err'); return; }
  addTopicChip(v, true);
  $('newTopicInput').value='';
};
$('newTopicInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('btnAddTopic').click(); } });

$('btnExtract').onclick = async ()=>{
  const raw = $('raw').value.trim();
  if(!raw){ toast('请先粘贴原始信息','err'); return; }
  const btn = $('btnExtract'); btn.disabled = true; const old = btn.textContent;
  btn.textContent = '抽取中…'; $('extractMsg').innerHTML='';
  try{
    const r = await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw})});
    const j = await r.json();
    if(!j.ok){ $('extractMsg').innerHTML = '<div class="errlist">'+(j.errors||[]).join('；')+'</div>'; toast('抽取失败','err'); return; }
    const d = j.data;
    F.forEach(id=>setVal(id, d[id]));
    if(Array.isArray(d.topics)) checkTopics(d.topics);
    if(Array.isArray(d.research)) checkGroup('research', d.research);
    // 清掉上一次的「新」候选，再渲染本次 LLM 推断的新主题
    document.querySelectorAll('#topics label.is-new').forEach(e=>e.remove());
    if(Array.isArray(d.suggested_topics)) d.suggested_topics.forEach(t=>addTopicChip(t, true));
    // 「原始笔记」逐字保留：把用户粘贴的原文回填（抽取不会覆盖已有内容）
    setVal('notes', $('raw').value);
    toast('已填充表单，请核对后提交','ok');
  }catch(e){ toast('网络错误：'+e,'err'); }
  finally{ btn.disabled=false; btn.textContent=old; }
};

$('btnSubmit').onclick = async ()=>{
  $('submitMsg').innerHTML='';
  const payload = {};
  F.forEach(id=>payload[id]=$(id).value);
  payload.date = $('date').value;            // 目标日报日期（迁移历史用，留空=今天）
  payload.topics = getCheckedTopics();
  payload.research = getCheckedResearch();
  const btn = $('btnSubmit'); btn.disabled=true; const old=btn.textContent; btn.textContent='提交中…';
  try{
    const r = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j = await r.json();
    if(!j.ok){ $('submitMsg').innerHTML='<div class="errlist">'+(j.errors||[]).join('；')+'</div>'; toast('提交失败','err'); return; }
    toast('✓ '+j.message,'ok');
    // 提交成功后清空表单，保留以便连续录入
    ['id','title','subtopic','summary','paper','code','dataset','link','content','purpose','notes'].forEach(id=>$(id).value='');
    document.querySelectorAll('#topics label.is-new').forEach(e=>e.remove()); // 新建的主题已落库，移除候选 chip
    document.querySelectorAll('#topics input, #research input').forEach(c=>c.checked=false);
    $('raw').value='';
  }catch(e){ toast('网络错误：'+e,'err'); }
  finally{ btn.disabled=false; btn.textContent=old; }
};
</script>
</body>
</html>
